name: CI

on:
  push:
    branches: [main, public-prep]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whale_engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Golden files match the engine
        run: |
          uv run python tests/make_golden.py --check
          uv run python tests/make_golden_graham.py --check
          uv run python tests/make_golden_lynch.py --check
          uv run python tests/make_golden_portfolio.py --check
