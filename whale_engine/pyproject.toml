[project]
name = "whale-engine"
version = "0.2.0"
description = "Deterministic whale-style company-diagnosis engine (SEC EDGAR data, fixed per-whale scoring rubrics)"
requires-python = ">=3.11"
dependencies = [
    "edgartools>=5.43.0",
    "yfinance>=0.2.50",
]

[project.scripts]
buffett = "whale_engine.cli:buffett_main"
whale = "whale_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_engine"]
