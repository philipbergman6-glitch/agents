[project]
name = "buffett-engine"
version = "0.1.0"
description = "Deterministic Warren Buffett-style company-diagnosis engine (SEC EDGAR data, fixed scoring rubric)"
requires-python = ">=3.11"
dependencies = [
    "edgartools>=5.43.0",
    "yfinance>=0.2.50",
]

[project.scripts]
buffett = "buffett_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buffett_engine"]
